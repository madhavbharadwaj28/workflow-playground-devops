name: Deploy to Staging

on:
  pull_request:
    types: [labeled]

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    if: github.event.label.name == 'status: approved-for-staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.yourapp.com   # ← REPLACE with your staging URL

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # ── Adapt the build steps to your stack ─────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for staging
        run: npm run build
        env:
          NODE_ENV: staging
      # ────────────────────────────────────────────────────────────────────────

      - name: Deploy to Staging Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /var/www/staging          # ← REPLACE with your staging path
            git fetch origin
            git checkout ${{ github.head_ref }}
            git pull origin ${{ github.head_ref }}
            npm ci --production
            pm2 restart app-staging      # ← REPLACE with your process manager command

      - name: Update PR label — mark as deployed to staging
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.removeLabel({
              owner, repo, issue_number,
              name: 'status: approved-for-staging'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner, repo, issue_number,
              labels: ['status: deployed-to-staging']
            });

      - name: Send email to QA Team
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SMTP_HOST }}
          server_port: 587
          secure: false
          username: ${{ secrets.EMAIL_SMTP_USER }}
          password: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          to: ${{ secrets.QA_TEAM_EMAIL }}
          from: "DevOps Bot <devops@yourcompany.com>"   # ← REPLACE
          subject: "🧪 Ready for Testing: ${{ github.event.pull_request.title }}"
          body: |
            Hi QA Team,

            A new feature is ready for testing on the staging environment.

            ──────────────────────────────────────────────────────────
            Feature   : ${{ github.event.pull_request.title }}
            Branch    : ${{ github.head_ref }}
            Author    : ${{ github.event.pull_request.user.login }}
            PR Link   : ${{ github.event.pull_request.html_url }}
            Staging   : https://staging.yourapp.com
            ──────────────────────────────────────────────────────────

            Please test the feature and update the PR label accordingly:

              ✅ Tests Pass → Add label: "status: approved-for-production"
              ❌ Tests Fail → Add label: "status: rejected" and comment findings on the PR

            Thanks,
            Automated DevOps Pipeline

      - name: Handle deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🔴 Staging Deployment Failed\n\nThe automated deployment to staging failed. DevOps team has been notified.\n\n[View run details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
