name: Notify on Rejection

on:
  pull_request:
    types: [labeled]

jobs:
  notify-rejection:
    name: Notify developer of rejection
    if: "github.event.label.name == 'status: rejected'"
    runs-on: ubuntu-latest

    steps:
      - name: Post comment on PR notifying developer
        uses: actions/github-script@v7
        with:
          script: |
            const stage = 'staging review or QA testing';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## ❌ Feature Rejected',
                '',
                `Hi @${context.payload.pull_request.user.login},`,
                '',
                'Your feature has been rejected during ' + stage + '. Please:',
                '',
                '1. Read the reviewer/QA comments above carefully',
                '2. Fix the issues on **this same branch** (no new branch needed)',
                '3. Push your fixes: `git push origin ${{ github.head_ref }}`',
                '4. Update this PR\'s label back to `status: ready-for-review`',
                '',
                'The reviewer will then re-review your changes.',
                '',
                '_Automated notification from DevOps pipeline_'
              ].join('\n')
            });

      - name: Send email to developer
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SMTP_HOST }}
          server_port: 587
          secure: false
          username: ${{ secrets.EMAIL_SMTP_USER }}
          password: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          to: ${{ secrets.QA_TEAM_EMAIL }}   # ← Replace with a way to get dev's email, or use a team DL
          from: "DevOps Bot <devops@yourcompany.com>"
          subject: "❌ Feature Rejected: ${{ github.event.pull_request.title }}"
          body: |
            Hi Team,

            The following feature was rejected and needs rework.

            ──────────────────────────────────────────────────────────
            Feature   : ${{ github.event.pull_request.title }}
            Branch    : ${{ github.head_ref }}
            Author    : ${{ github.event.pull_request.user.login }}
            PR Link   : ${{ github.event.pull_request.html_url }}
            ──────────────────────────────────────────────────────────

            Please check the PR comments for details on what needs to be fixed.

            Thanks,
            Automated DevOps Pipeline
